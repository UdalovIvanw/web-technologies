<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Адаптивна галерея фотографій</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="gallery-main">
    <section class="gallery-hero">
        <div class="photo-card"><img src="https://picsum.photos/300/300?random=1" alt="Фото 1"></div>
        <div class="photo-card"><img src="https://picsum.photos/300/300?random=2" alt="Фото 2"></div>
        <div class="photo-card photo-main"><img src="https://picsum.photos/600/600?random=3" alt="Основне фото"></div>
        <div class="photo-card"><img src="https://picsum.photos/300/300?random=4" alt="Фото 4"></div>
        <div class="photo-card"><img src="https://picsum.photos/300/300?random=5" alt="Фото 5"></div>
    </section>
</main>

<footer class="gallery-footer">
    <div class="photo-card"><img src="https://picsum.photos/300/300?random=11" alt="Футер 1"></div>
    <div class="photo-card"><img src="https://picsum.photos/300/300?random=12" alt="Футер 2"></div>
    <div class="photo-card"><img src="https://picsum.photos/300/300?random=13" alt="Футер 3"></div>
    <div class="photo-card"><img src="https://picsum.photos/300/300?random=14" alt="Футер 4"></div>
    <div class="photo-card"><img src="https://picsum.photos/300/300?random=15" alt="Футер 5"></div>
    <div class="photo-card"><img src="https://picsum.photos/300/300?random=16" alt="Футер 6"></div>
</footer>
</body>
</html>
