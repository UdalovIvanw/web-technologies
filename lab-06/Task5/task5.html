
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Weather</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="weather-background">
    <div class="weather-daily">
        <div class="weather-photo">
            <img src="images/cloud.png" alt="cloud">
        </div>
        <div class="weather-text">17°</div>
    </div>
    <ul class="weather-weekly">
        <li>Mon<br><b>17°</b></li>
        <li>Tue<br><b>19°</b></li>
        <li>Wed<br><b>16°</b></li>
        <li>Thu<br><b>18°</b></li>
        <li>Fri<br><b>21°</b></li>
    </ul>
    <div class="weather-navigation">
        <span>⬅</span>
        <span>⮕</span>
    </div>

</div>

</body>
</html>
