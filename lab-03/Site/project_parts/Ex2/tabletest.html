<!doctype html>
<html lang="uk">
<head>
    <style type="text/css">
        table { border-collapse: collapse; width: 400px;}
        td { border: 5px solid #000; }
        tr {width: 60px; height: 60px; }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Web technologies practice: basic HTML tags</title>
</head>
<body>
<header></header>
<main>
    <table border="1" cellpadding="50" cellspacing="0">
        <tr>
            <td colspan="2"></td>
            <td colspan="4"></td>
            <td colspan="2" bgcolor="yellow"></td>
        </tr>
        <tr>
            <td rowspan="2"></td>
            <td colspan="5" rowspan="4" bgcolor="red"></td>
            <td colspan="2" rowspan="2" bgcolor="yellow"></td>
        </tr>
        <tr></tr>
        <tr>
            <td rowspan="3"></td>
            <td rowspan="2"></td>
            <td rowspan="2"></td>
        </tr>
        <tr></tr>
        <tr>
            <td rowspan="2" colspan="2" bgcolor="black"></td>
            <td colspan="2"></td>
            <td colspan="3"></td>
        </tr>
        <tr>
            <td rowspan="3" bgcolor="yellow"></td>
            <td colspan="2"></td>
            <td colspan="3" rowspan="2" bgcolor="blue"></td>
        </tr>
        <tr>
            <td colspan="2" rowspan="2"></td>
            <td colspan="2" bgcolor="black"></td>
        </tr>
        <tr>
            <td colspan="5"></td>
        </tr>
    </table>


</main>
<footer></footer>
</body>
</html>
