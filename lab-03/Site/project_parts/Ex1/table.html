<!doctype html>
<html lang="uk">
<head>
    <style type="text/css">
        table { border-collapse: collapse; width: 400px;}
        td { border: 5px solid #000; }
        tr {width: 60px; height: 60px; }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Web technologies practice: basic HTML tags</title>
</head>
<body>
<header></header>
<main>
    <table border="2" cellspacing="0" cellpadding="30" align="center">
        <tr>
            <td colspan="8" bgcolor="#17e6c0"></td>
        </tr>

        <tr>
            <td rowspan="6" bgcolor="#fffde0"></td>
            <td colspan="6" bgcolor="#17e6c0"></td>
            <td rowspan="6" bgcolor="#fffde0"></td>
        </tr>

        <tr>
            <td rowspan="4" bgcolor="#fffde0"></td>
            <td colspan="4" bgcolor="#17e6c0"></td>
            <td rowspan="4" bgcolor="#fffde0"></td>
        </tr>


        <tr>
            <td rowspan="2" bgcolor="#fffde0"></td>
            <td bgcolor="#ff0000"></td>
            <td bgcolor="#0000ff"></td>
            <td rowspan="2" bgcolor="#fffde0"></td>
        </tr>

        <tr>
            <td bgcolor="#00ff00"></td>
            <td bgcolor="#ffff00"></td>
        </tr>

        <tr>
            <td colspan="4" bgcolor="#17e6c0"></td>
        </tr>

        <tr>
            <td colspan="6" bgcolor="#17e6c0"></td>
        </tr>

        <tr>
            <td colspan="8" bgcolor="#17e6c0"></td>
        </tr>
    </table>


</main>
<footer></footer>
</body>
</html>
